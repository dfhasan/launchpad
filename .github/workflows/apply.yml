name: Apply

# Merge to main = desired state. Git is the source of truth (GitOps for infra):
# platform -> environments -> observability, in that order.

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - "environments/**"
      - "observability/**"
  workflow_dispatch:   # also called by the build / reaper workflows

permissions:
  contents: read
  id-token: write

concurrency:
  group: apply          # never two applies at once
  cancel-in-progress: false

jobs:
  apply:
    if: vars.AWS_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production   # protected: required reviewers / main only
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATADOG_API_KEY_SSM_NAME: ${{ vars.DATADOG_API_KEY_SSM_NAME }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
          terraform_wrapper: false

      - name: Apply platform
        run: scripts/tf.sh live/platform apply

      - name: Apply environments
        run: scripts/tf.sh live/environments apply

      - name: Apply observability (Datadog)
        if: vars.DATADOG_API_URL != ''
        env:
          DATADOG_API_URL: ${{ vars.DATADOG_API_URL }}
          DD_NOTIFY: ${{ vars.DD_NOTIFY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: scripts/tf.sh observability/datadog apply

      - name: Summary
        run: |
          {
            echo "## 🚀 Environments"
            echo '```json'
            terraform -chdir=live/environments output -json environments
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
