apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: safebrief
    newName: ghcr.io/dfhasan/safebrief
    newTag: "bootstrap"      # promoted by PR: copy the tag from dev once it's verified
configMapGenerator:
  - name: safebrief-config
    behavior: merge
    literals:
      - APP_URL=http://localhost:8081
      - LOG_LEVEL=warning
patches:
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: { kind: Service, name: web }
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081
