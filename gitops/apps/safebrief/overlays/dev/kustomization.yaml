apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: safebrief
    newName: ghcr.io/dfhasan/safebrief
    newTag: "bootstrap"      # bumped automatically by the deploy-safebrief workflow
configMapGenerator:
  - name: safebrief-config
    behavior: merge
    literals:
      - APP_URL=http://localhost:8080
      - LOG_LEVEL=debug
